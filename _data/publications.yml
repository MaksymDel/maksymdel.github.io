- title: "How Uncertainty Estimation Scales with Sampling in Reasoning Models"
  year: 2026
  image: /images/reasoning-confidence.png
  image_alt: "Sampling-efficiency curves for confidence estimation across reasoning models and benchmarks"
  authors: "<strong>Maksym Del</strong>, Markus Kängsepp, Marharyta Domnich, Ardi Tampuu, Lisa Yankovskaya, Meelis Kull, Mark Fishel"
  venue: "Preprint"
  arxiv: https://arxiv.org/abs/2603.19118
  description: "We show that combining verbalized confidence and self-consistency with two samples improves AUROC by up to 12 points on average, outperforming either signal alone even at larger sampling budgets."

- title: "To Err Is Human, but Llamas Can Learn It Too"
  year: 2024
  image: /images/gec.png
  image_alt: "Overview of an LLM-based pipeline for artificial error generation and grammatical error correction"
  authors: "Agnes Luhtaru*, Taido Purason*, Martin Vainikko, <strong>Maksym Del</strong>, Mark Fishel"
  venue: "Findings of EMNLP"
  arxiv: https://arxiv.org/abs/2403.05493
  paper: https://aclanthology.org/2024.findings-emnlp.727/
  note: "* Equal contribution."
  description: "We generate human-like errors with language models and use them to train grammatical error correction systems, improving the previous state of the art across German, Ukrainian, and Estonian."

- title: "Multilingual and Multi-Domain Representational Patterns Across Transformer-Based Models"
  year: 2024
  image: /images/thesis-cover.png
  image_alt: "Cover of Maksym Del's PhD thesis on multilingual and multi-domain transformer representations"
  authors: "<strong>Maksym Del</strong>"
  venue: "PhD thesis, University of Tartu"
  paper: https://hdl.handle.net/10062/105563
  description: "This thesis examines how transformer models organize languages and domains internally, including where shared representations emerge and where they remain fragmented."

- title: "True Detective: A Deep Abductive Reasoning Benchmark Undoable for GPT-3 and Challenging for GPT-4"
  year: 2023
  image: /images/true-detective.jpg
  image_alt: "Illustration for the True Detective abductive-reasoning benchmark"
  authors: "<strong>Maksym Del</strong>, Mark Fishel"
  venue: "*SEM"
  paper: https://aclanthology.org/2023.starsem-1.28/
  code: https://github.com/MaksymDel/true-detective
  description: "We introduce a 191-puzzle benchmark exposing a major limitation in abductive reasoning: then-frontier GPT-4 scored 38%, versus over 80% for top human solvers."

- title: "Cross-lingual Similarity of Multilingual Representations Revisited"
  year: 2022
  image: /images/xsim-revisited.png
  image_alt: "Layer-wise cross-lingual similarity patterns in multilingual language models"
  authors: "<strong>Maksym Del</strong>, Mark Fishel"
  venue: "AACL"
  paper: https://aclanthology.org/2022.aacl-main.15/
  code: https://github.com/TartuNLP/xsim
  note: "Oral presentation."
  description: "We introduce Average Neuron-Wise Correlation (ANC), reducing the required neuron-wise comparisons from O(N²) to O(N), and show that multilingual models first align languages before specializing for prediction."

- title: "Similarity of Sentence Representations in Multilingual LMs: Resolving Conflicting Literature and a Case Study of Baltic Languages"
  year: 2022
  image: /images/baltic.png
  image_alt: "Cross-lingual sentence representation similarities for Baltic and other languages"
  authors: "<strong>Maksym Del</strong>, Mark Fishel"
  venue: "Baltic Journal of Modern Computing"
  paper: https://doi.org/10.22364/bjmc.2022.10.3.07
  code: https://github.com/TartuNLP/xsim
  description: "We resolve conflicting findings about multilingual representations and show that most languages, including low-resource Baltic languages, share a cross-lingual space, while a few remain separate."

- title: "Translation Transformers Rediscover Inherent Data Domains"
  year: 2021
  image: /images/domains.png
  image_alt: "Visualization of domain structure in neural machine translation representations"
  authors: "<strong>Maksym Del</strong>*, Elizaveta Korotkova*, Mark Fishel"
  venue: "WMT"
  paper: https://aclanthology.org/2021.wmt-1.65/
  code: https://github.com/TartuNLP/xsim
  note: "* Equal contribution."
  description: "We show that translation models recover latent data domains, then reuse their representations for unsupervised adaptation, avoiding a separate language model and improving in-browser English-to-Estonian translation by up to 1.6 BLEU."

- title: "Grammatical Error Correction and Style Transfer via Zero-shot Monolingual Translation"
  year: 2019
  image: /images/style-transfer.png
  image_alt: "Zero-shot monolingual translation setup for grammatical error correction and style transfer"
  authors: "Elizaveta Korotkova, Agnes Luhtaru, <strong>Maksym Del</strong>, Krista Liin, Daiga Deksne, Mark Fishel"
  venue: "Preprint"
  arxiv: https://arxiv.org/abs/1903.11283
  description: "We use a single multilingual translation model for grammatical error correction and style transfer, without task-specific training data."

