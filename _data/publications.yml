- title: "True Detective: A Deep Abductive Reasoning Benchmark Undoable for GPT-3 and Challenging for GPT-4"
  year: 2023
  image: /images/true-detective.jpg
  image_alt: "Illustration for the True Detective abductive-reasoning benchmark"
  authors: "<strong>Maksym Del</strong>, Mark Fishel"
  venue: "*SEM"
  paper: https://aclanthology.org/2023.starsem-1.28/
  code: https://github.com/MaksymDel/true-detective
  description: "We introduce 191 short-form detective puzzles for evaluating abductive reasoning and find a 42-percentage-point accuracy gap between GPT-4 and top human solvers."

